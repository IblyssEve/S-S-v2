<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта заброшек — S&S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  #map {
    height: 60vh;
    width: 100%;
    border: 1px solid var(--blood);
    box-shadow: 0 0 30px rgba(204, 0, 0, 0.1);
    margin-bottom: 40px;
    z-index: 1;
    background: #000;
  }
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.6) contrast(1.2);
  }
  .leaflet-marker-pane {
    filter: none !important;
  }
  
  .map-note {
    text-align: center;
    color: var(--blood);
    font-family: 'Caveat', cursive;
    font-size: 28px;
    margin-bottom: 20px;
    text-shadow: 0 0 15px var(--blood-glow);
  }
  
  .custom-pentagram-icon {
    filter: drop-shadow(0 0 8px rgba(204, 0, 0, 0.8));
    transition: transform 0.2s;
  }
  .custom-pentagram-icon:hover {
    transform: scale(1.2);
  }
</style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<div style="padding: 20px; max-width: 1100px; margin: 0 auto;">
  <a href="index.html" class="btn" style="border-color: var(--muted); color: var(--muted);">&larr; На главную</a>
</div>

<section id="map-section">
  <h2 class="sec-title">Карта заброшек</h2>
  <p class="sec-sub">Места, где мы были. Визуал на пути из бездны.</p>

  <div class="map-note">Визуал на пути из бездны</div>

  <div id="map"></div>
</section>

<!-- НИЦШЕ -->
<section class="nietzsche" style="padding-top: 20px;">
  <blockquote>«Что не убивает нас, делает нас заброшками.»</blockquote>
  <p class="sign">— Ницше, наверное</p>
  <img class="nietzsche-photo" src="https://iblysseve.github.io/SS/Friedrich_Nietzsche_drawn_by_Hans_Olde.jpg" alt="Ницше" />
  <p class="micro">Соня любит «Птицу Емъ». Ситников любит Ницше. Все любят Соню. Всё сходится.</p>
</section>

<!-- ФУТЕР -->
<footer>
  <div class="logo">S&amp;S</div>
  <p>Соня и Саня. Хроники, музыка, ритуалы.</p>
  <p class="copy">© S&amp;S</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([59.94, 30.31], 11);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // Создаем иконку "Проволока в крови"
  var pentagramIcon = L.divIcon({
    className: 'custom-pentagram-icon',
    html: `<svg viewBox="0 0 100 100" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
             <defs>
               <!-- Градиент для металла (проволоки) -->
               <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
                 <stop offset="0%" stop-color="#555" />
                 <stop offset="50%" stop-color="#222" />
                 <stop offset="100%" stop-color="#4a4538" />
               </linearGradient>
               
               <!-- Градиент для крови -->
               <linearGradient id="blood" x1="0%" y1="0%" x2="0%" y2="100%">
                 <stop offset="0%" stop-color="#ff0000" />
                 <stop offset="100%" stop-color="#4a0000" />
               </linearGradient>
             </defs>
             
             <!-- Круг (проволока) -->
             <circle cx="50" cy="50" r="45" fill="none" stroke="url(#rust)" stroke-width="4"/>
             <circle cx="50" cy="50" r="45" fill="none" stroke="url(#blood)" stroke-width="1.5" opacity="0.8" stroke-dasharray="10 5"/>
             
             <!-- Звезда (проволока) -->
             <path d="M50 5 L63 38 L98 38 L70 60 L80 95 L50 73 L20 95 L30 60 L2 38 L37 38 Z" 
                   fill="none" stroke="url(#rust)" stroke-width="4" stroke-linejoin="miter"/>
             
             <!-- Кровавые разводы на звезде -->
             <path d="M50 5 L63 38 L98 38 L70 60 L80 95 L50 73 L20 95 L30 60 L2 38 L37 38 Z" 
                   fill="none" stroke="url(#blood)" stroke-width="1.5" stroke-linejoin="miter" opacity="0.9" transform="translate(0.5, 0.5)"/>
             
             <!-- Потёки крови (капли) -->
             <path d="M22 90 Q20 98 16 100 Q12 98 14 92 Z" fill="url(#blood)" />
             <path d="M78 90 Q80 98 84 100 Q88 98 86 92 Z" fill="url(#blood)" />
             <path d="M50 73 Q52 82 50 88 Q48 82 50 73 Z" fill="url(#blood)" />
             
             <!-- Мелкие брызги -->
             <circle cx="15" cy="70" r="1.5" fill="#ff0000" opacity="0.7"/>
             <circle cx="85" cy="65" r="2" fill="#ff0000" opacity="0.6"/>
             <circle cx="25" cy="30" r="1" fill="#ff0000" opacity="0.5"/>
             <circle cx="75" cy="30" r="1.5" fill="#ff0000" opacity="0.5"/>
           </svg>`,
    iconSize: [50, 50],
    iconAnchor: [25, 25],
    popupAnchor: [0, -25]
  });

  // Метки с новой иконкой
  var marker1 = L.marker([60.022670, 30.389485], {icon: pentagramIcon}).addTo(map);
  marker1.bindPopup("<b>Вавиловых, 12</b><br>Заброшенный роддом");

  var marker2 = L.marker([59.9143, 30.3389], {icon: pentagramIcon}).addTo(map);
  marker2.bindPopup("<b>Обводный канал, 62</b><br>Бывший ДК имени 10-летия Октября");

  var marker3 = L.marker([59.8636, 29.9906], {icon: pentagramIcon}).addTo(map);
  marker3.bindPopup("<b>Михайловская дача</b><br>Дворцово-парковый ансамбль в Петергофе");
</script>

</body>
</html>
