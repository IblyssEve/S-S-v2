<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта заброшек — S&S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  #map {
    height: 60vh;
    width: 100%;
    border: 1px solid var(--blood);
    box-shadow: 0 0 30px rgba(204, 0, 0, 0.1);
    margin-bottom: 40px;
    z-index: 1;
    background: #000;
  }
  /* Фильтр только для слоя карты */
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.6) contrast(1.2);
  }
  /* Снимаем фильтр с маркеров, чтобы они были яркими */
  .leaflet-marker-pane {
    filter: none !important;
  }
  
  .map-note {
    text-align: center;
    color: var(--blood);
    font-family: 'Caveat', cursive;
    font-size: 28px;
    margin-bottom: 20px;
    text-shadow: 0 0 15px var(--blood-glow);
  }
  
  .custom-pentagram-icon {
    filter: drop-shadow(0 0 5px var(--blood-glow));
    transition: transform 0.2s;
  }
  .custom-pentagram-icon:hover {
    transform: scale(1.2);
  }
</style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<div style="padding: 20px; max-width: 1100px; margin: 0 auto;">
  <a href="index.html" class="btn" style="border-color: var(--muted); color: var(--muted);">&larr; На главную</a>
</div>

<section id="map-section">
  <h2 class="sec-title">Карта заброшек</h2>
  <p class="sec-sub">Места, где мы были. Визуал на пути из бездны.</p>

  <div class="map-note">Визуал на пути из бездны</div>

  <div id="map"></div>
</section>

<!-- НИЦШЕ -->
<section class="nietzsche" style="padding-top: 20px;">
  <blockquote>«Что не убивает нас, делает нас заброшками.»</blockquote>
  <p class="sign">— Ницше, наверное</p>
  <img class="nietzsche-photo" src="https://iblysseve.github.io/SS/Friedrich_Nietzsche_drawn_by_Hans_Olde.jpg" alt="Ницше" />
  <p class="micro">Соня любит «Птицу Емъ». Ситников любит Ницше. Все любят Соню. Всё сходится.</p>
</section>

<!-- ФУТЕР -->
<footer>
  <div class="logo">S&amp;S</div>
  <p>Соня и Саня. Хроники, музыка, ритуалы.</p>
  <p class="copy">© S&amp;S</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([59.94, 30.31], 11);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // Создаем кастомную иконку-пентаграмму
  var pentagramIcon = L.divIcon({
    className: 'custom-pentagram-icon',
    html: `<svg viewBox="0 0 100 100" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
             <path d="M50 5 L63 38 L98 38 L70 60 L80 95 L50 73 L20 95 L30 60 L2 38 L37 38 Z" 
                   fill="none" stroke="#cc0000" stroke-width="4" stroke-linejoin="round"/>
           </svg>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -15]
  });

  // Метки с новой иконкой
  var marker1 = L.marker([60.022670, 30.389485], {icon: pentagramIcon}).addTo(map);
  marker1.bindPopup("<b>Вавиловых, 12</b><br>Заброшенный роддом");

  var marker2 = L.marker([59.9143, 30.3389], {icon: pentagramIcon}).addTo(map);
  marker2.bindPopup("<b>Обводный канал, 62</b><br>Бывший ДК имени 10-летия Октября");

  var marker3 = L.marker([59.8636, 29.9906], {icon: pentagramIcon}).addTo(map);
  marker3.bindPopup("<b>Михайловская дача</b><br>Дворцово-парковый ансамбль в Петергофе");
</script>

</body>
</html>
