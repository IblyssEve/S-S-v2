<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга ритуалов — S&S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  /* Стили только для этой страницы (чтобы не трогать основной style.css) */
  .ritual-photo {
    width: 100%; max-height: 80vh; object-fit: contain;
    border: 1px solid #1a1a1a; display: block; margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  .ritual-box {
    background: #0a0a0a; border: 1px solid var(--blood); padding: 40px;
    text-align: center; position: relative; box-shadow: 0 0 40px rgba(204, 0, 0, 0.1);
  }
  .ritual-box::before {
    content: '✶'; position: absolute; top: 12px; left: 16px;
    color: var(--blood); opacity: 0.7; text-shadow: 0 0 10px var(--blood-glow);
  }
  .ritual-card-title {
    font-family: 'Unbounded', sans-serif; font-size: 24px; color: var(--blood);
    text-shadow: 0 0 15px var(--blood-glow); margin-bottom: 8px;
  }
  .ritual-card-astro {
    font-size: 12px; color: var(--violet); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 24px;
  }
  .ritual-scheme {
    font-size: 14px; color: var(--white); margin-bottom: 24px; line-height: 1.8;
    text-align: left; background: rgba(255,255,255,0.03); padding: 20px; border-left: 2px solid var(--violet);
  }
  .ritual-instruction {
    font-family: 'Caveat', cursive; font-size: clamp(22px, 4vw, 36px);
    color: var(--white); line-height: 1.4; margin-bottom: 32px;
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
  }
  #ritual-container { display: none; margin-bottom: 32px; }
  #ritual-placeholder {
    font-family: 'Caveat', cursive; font-size: clamp(22px, 4vw, 36px);
    color: var(--muted); min-height: 100px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 32px;
  }
</style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<div style="padding: 20px; max-width: 1100px; margin: 0 auto;">
  <a href="index.html" class="btn" style="border-color: var(--muted); color: var(--muted);">&larr; На главную</a>
</div>

<!-- СЕКЦИЯ РИТУАЛОВ -->
<section id="rituals">
  <h2 class="sec-title">Книга ритуалов</h2>
  <p class="sec-sub">Нешуточные ритуалы. Работают.</p>

  <!-- Коллаж -->
  <img class="ritual-photo" src="https://iblysseve.github.io/SS/Picsart_26-10-29_20-50-40-378.jpg" alt="Ритуал" />

  <div class="ritual-box">
    <div id="ritual-placeholder">Нажми на кнопку — получишь ритуал.</div>
    <div id="ritual-container">
      <div class="ritual-card-title" id="r-title"></div>
      <div class="ritual-card-astro" id="r-astro"></div>
      <div class="ritual-scheme" id="r-scheme"></div>
      <div class="ritual-instruction" id="r-instruction"></div>
    </div>
    <button class="btn" onclick="generateRitual()">Сгенерировать ритуал</button>
  </div>
</section>

<!-- ФУТЕР -->
<footer>
  <div class="logo">S&amp;S</div>
  <p>Соня и Саня. Хроники, музыка, ритуалы.</p>
  <p class="copy">© S&amp;S</p>
</footer>

<script src="ritual.js"></script>
</body>
</html>
